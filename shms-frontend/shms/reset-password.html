<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SHMS</title>
  <meta name="description" content="Set a new password for your SHMS account">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font-family);background:#fff;overflow-x:hidden}

    .auth-split{display:flex;min-height:100vh}
    .auth-left{
      width:48%;background:linear-gradient(160deg,#0a2e1f 0%,#0f3d2a 40%,#124a31 100%);
      display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px;
      position:relative;overflow:hidden;
    }
    .auth-left::before{
      content:'';position:absolute;top:-20%;right:-20%;width:500px;height:500px;
      border-radius:50%;background:rgba(16,185,129,0.08);pointer-events:none;
    }
    .al-brand{display:flex;align-items:center;gap:10px;z-index:1}
    .al-brand svg{width:32px;height:32px;color:#10b981}
    .al-brand span{font-size:18px;font-weight:700;color:#fff}
    .al-brand .portal{color:#10b981}
    .al-content{z-index:1}
    .al-content h1{font-size:38px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:16px}
    .al-content h1 .green{color:#10b981}
    .al-content p{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.7;max-width:400px}
    .al-footer{z-index:1;font-size:13px;color:rgba(255,255,255,0.6)}
    .al-footer strong{color:#fff;font-weight:600}

    .auth-right{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:48px;background:#fff;position:relative;
    }
    .ar-form{width:100%;max-width:420px}
    .ar-badge{
      display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
      border:1.5px solid #d1fae5;border-radius:20px;font-size:13px;font-weight:500;
      color:#059669;margin-bottom:20px;background:#f0fdf4;
    }
    .ar-badge svg{width:14px;height:14px}
    .ar-form h2{font-size:28px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
    .ar-form .subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:32px}
    .ar-form .subtitle a{color:#10b981;font-weight:600;text-decoration:none}

    .ar-field{margin-bottom:20px}
    .ar-field label{display:block;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
    .ar-input-wrap{position:relative}
    .ar-input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-light);pointer-events:none}
    .ar-input-wrap input{
      width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--border);
      border-radius:var(--radius);font-size:14px;background:var(--bg-primary);
      transition:all 0.2s;color:var(--text-primary);
    }
    .ar-input-wrap input:focus{border-color:#10b981;outline:none;box-shadow:0 0 0 3px rgba(16,185,129,0.1)}
    .ar-input-wrap input::placeholder{color:var(--text-light)}
    .ar-input-wrap .toggle-pw{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--text-light);
      padding:4px;display:flex;
    }
    .ar-input-wrap .toggle-pw:hover{color:var(--text-primary)}

    .ar-submit{
      width:100%;padding:14px;border:none;border-radius:var(--radius);
      background:#10b981;color:#fff;font-size:15px;font-weight:600;
      cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .ar-submit:hover{background:#059669;transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,0.3)}

    .ar-back{text-align:center;margin-top:24px;font-size:14px;color:var(--text-secondary)}
    .ar-back a{color:#10b981;font-weight:600;text-decoration:none}
    .ar-back a:hover{text-decoration:underline}

    .auth-alert{display:none;align-items:center;gap:8px;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
    .auth-alert.error{display:flex;background:#fce4ec;color:#c62828;border:1px solid #f8bbd0}
    .auth-alert.success{display:flex;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}

    @media(max-width:1024px){
      .auth-left{display:none}
      .auth-right{padding:32px 24px}
    }
  </style>
</head>
<body>
  <div class="auth-split">
    <div class="auth-left">
      <div class="al-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>SHMS <span class="portal">Portal</span></span>
      </div>
      <div class="al-content">
        <h1>Choose a new<br><span class="green">password.</span></h1>
        <p>Make sure it is at least 8 characters and something you have not used before.</p>
      </div>
      <div class="al-footer">Trusted by <strong>2,400+ students</strong> across 18 schools</div>
    </div>
    <div class="auth-right">
      <div class="ar-form">
        <div class="ar-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> New password</div>
        <h2>Set a new password</h2>
        <div class="subtitle">Use the reset link from your email to secure your account.</div>

        <form class="auth-form" id="resetForm" novalidate>
          <div class="ar-field">
            <label for="password">New password</label>
            <div class="ar-input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
              <button type="button" class="toggle-password toggle-pw" aria-label="Toggle password visibility" data-target="password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="ar-field">
            <label for="confirm_password">Confirm new password</label>
            <div class="ar-input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
            </div>
          </div>
          <button type="submit" class="ar-submit" id="resetSubmit">
            Reset password
          </button>
        </form>

        <div class="ar-back"><a href="login.html">&larr; Back to sign in</a></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('resetForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        const submitBtn = document.getElementById('resetSubmit');

        if (!token) {
          Auth.showError(form, 'Reset link is missing. Please use the link from your email.');
          return;
        }
        if (password.length < 8) {
          Auth.showError(form, 'Password must be at least 8 characters');
          return;
        }
        if (password !== confirm) {
          Auth.showError(form, 'Passwords do not match');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Resetting...';
        try {
          const res = await API.resetPassword(token, password);
          Auth.showSuccess(form, res.message || 'Password reset successfully. Redirecting to sign in...');
          setTimeout(() => window.location.href = 'login.html', 2500);
        } catch (err) {
          Auth.showError(form, err.message || 'Could not reset password. Please try again.');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      });
    });
  </script>
</body>
</html>
