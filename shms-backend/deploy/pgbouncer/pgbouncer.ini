# PgBouncer configuration for SHMS (multi-instance connection pooling)
# Tune pool sizes to your database server; these are sane defaults.

[databases]
shms_db = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# md5 requires a password entry in userlist.txt (see userlist.txt.example)
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 4
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 5

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid