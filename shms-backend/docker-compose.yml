# SHMS API container.
#
# The PostgreSQL server (shms_db) runs on the host and is reached from the
# container through the Docker Desktop host-gateway. Override via .env if it
# runs somewhere else.
#
# Usage:
#   docker compose build
#   docker compose up -d
#
# The API reads DATABASE_URL, JWT_SECRET and JWT_EXPIRES_IN from .env.
# Note: there are no Redis or PgBouncer services - the current application
# does not use them (state and rate-limit counters are in-process).
services:
  api:
    build: .
    restart: unless-stopped
    extra_hosts:
      host.docker.internal: host-gateway
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Must point at the host PostgreSQL reachable from the container, e.g.
      #   postgresql://USER:PASSWORD@host.docker.internal:5432/shms_db
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to a host-reachable PostgreSQL URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3