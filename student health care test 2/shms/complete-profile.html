<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - SHMS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font-family);background:var(--bg-primary,#f8fafc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .cp-container{width:100%;max-width:640px}
    .cp-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);overflow:hidden}
    .cp-header{background:linear-gradient(135deg,#0a2e1f,#124a31);color:#fff;padding:40px 32px 32px;text-align:center}
    .cp-header h1{font-size:24px;font-weight:700;margin-bottom:8px}
    .cp-header p{font-size:14px;opacity:0.85;line-height:1.5}
    .cp-body{padding:32px}
    .cp-section{margin-bottom:28px}
    .cp-section:last-child{margin-bottom:0}
    .cp-section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary,#64748b);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border,#e2e8f0)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary,#64748b);margin-bottom:6px}
    .form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--border,#e2e8f0);border-radius:8px;font-size:14px;color:var(--text-primary,#1e293b);background:#fff;transition:border-color 0.2s}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary,#10b981);box-shadow:0 0 0 3px rgba(16,185,129,0.1)}
    .cp-footer{padding:0 32px 32px;display:flex;gap:12px;justify-content:flex-end}
    .btn{padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s}
    .btn-primary{background:var(--primary,#10b981);color:#fff}
    .btn-primary:hover{background:var(--primary-dark,#059669)}
    .btn-primary:disabled{opacity:0.6;cursor:not-allowed}
    .btn-ghost{background:transparent;color:var(--text-secondary,#64748b);border:1px solid var(--border,#e2e8f0)}
    .btn-ghost:hover{background:var(--bg-secondary,#f1f5f9)}
    .cp-welcome{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:16px;background:var(--bg-secondary,#f0fdf4);border-radius:12px;border:1px solid #bbf7d0}
    .cp-welcome-icon{font-size:32px;line-height:1}
    .cp-welcome-text h3{font-size:15px;font-weight:600;color:var(--text-primary,#1e293b)}
    .cp-welcome-text p{font-size:13px;color:var(--text-secondary,#64748b);margin-top:2px}
    .cp-progress{height:4px;background:var(--border,#e2e8f0);border-radius:2px;margin-bottom:24px;overflow:hidden}
    .cp-progress-bar{height:100%;background:var(--primary,#10b981);border-radius:2px;transition:width 0.3s}
    @media(max-width:600px){.form-row{grid-template-columns:1fr}.cp-body{padding:24px}.cp-header{padding:32px 24px 24px}.cp-footer{padding:0 24px 24px}}
  </style>
</head>
<body>
  <div class="cp-container">
    <div class="cp-card">
      <div class="cp-header">
        <h1>Complete Your Profile</h1>
        <p>Tell us a bit more about yourself so we can provide better healthcare services.</p>
      </div>
      <div class="cp-body">
        <div class="cp-progress"><div class="cp-progress-bar" id="progressBar" style="width:0%"></div></div>

        <div class="cp-welcome">
          <div class="cp-welcome-icon">👋</div>
          <div class="cp-welcome-text">
            <h3>Welcome, <span id="welcomeName">Student</span>!</h3>
            <p>This will only take a minute. You can also skip and complete later from your profile page.</p>
          </div>
        </div>

        <form id="completeProfileForm">
          <div class="cp-section">
            <div class="cp-section-title">Academic Information</div>
            <div class="form-row">
              <div class="form-group">
                <label for="cpFaculty">Faculty</label>
                <select id="cpFaculty">
                  <option value="">Select Faculty</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Science">Science</option>
                  <option value="Arts">Arts</option>
                  <option value="Social Sciences">Social Sciences</option>
                  <option value="Medicine">Medicine</option>
                  <option value="Law">Law</option>
                  <option value="Education">Education</option>
                  <option value="Management Sciences">Management Sciences</option>
                  <option value="Environmental Sciences">Environmental Sciences</option>
                  <option value="Agriculture">Agriculture</option>
                </select>
              </div>
              <div class="form-group">
                <label for="cpDepartment">Department</label>
                <input type="text" id="cpDepartment" placeholder="e.g. Computer Science">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="cpLevel">Level</label>
                <select id="cpLevel">
                  <option value="">Select Level</option>
                  <option value="100">100 Level</option>
                  <option value="200">200 Level</option>
                  <option value="300">300 Level</option>
                  <option value="400">400 Level</option>
                  <option value="500">500 Level</option>
                  <option value="600">600 Level</option>
                </select>
              </div>
              <div class="form-group">
                <label for="cpMatric">Matric Number</label>
                <input type="text" id="cpMatric" placeholder="e.g. CSC/2021/001">
              </div>
            </div>
          </div>

          <div class="cp-section">
            <div class="cp-section-title">Personal Information</div>
            <div class="form-row">
              <div class="form-group">
                <label for="cpGender">Gender</label>
                <select id="cpGender">
                  <option value="">Select Gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="cpDOB">Date of Birth</label>
                <input type="date" id="cpDOB">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="cpBloodGroup">Blood Group</label>
                <select id="cpBloodGroup">
                  <option value="">Select Blood Group</option>
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="O+">O+</option>
                  <option value="O-">O-</option>
                </select>
              </div>
              <div class="form-group">
                <label for="cpGenotype">Genotype</label>
                <select id="cpGenotype">
                  <option value="">Select Genotype</option>
                  <option value="AA">AA</option>
                  <option value="AS">AS</option>
                  <option value="SS">SS</option>
                  <option value="AC">AC</option>
                  <option value="SC">SC</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="cpAllergies">Known Allergies</label>
              <input type="text" id="cpAllergies" placeholder="e.g. Penicillin, Peanuts (or None)">
            </div>
          </div>

          <div class="cp-section">
            <div class="cp-section-title">Emergency Contact</div>
            <div class="form-row">
              <div class="form-group">
                <label for="cpEmergName">Contact Name</label>
                <input type="text" id="cpEmergName" placeholder="e.g. Parent or Guardian">
              </div>
              <div class="form-group">
                <label for="cpEmergPhone">Contact Phone</label>
                <input type="tel" id="cpEmergPhone" placeholder="e.g. +2348012345678">
              </div>
            </div>
          </div>

          <div class="cp-footer">
            <button type="button" class="btn btn-ghost" id="skipBtn">Skip for Now</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      if (!Auth.requireAuth()) return;

      let currentUser = null;

      async function init() {
        const result = await Auth.verifySession();
        if (!result.success) { Auth.logout(); return; }
        currentUser = result.user;

        document.getElementById('welcomeName').textContent = currentUser.full_name || 'Student';

        // Pre-fill known fields
        if (currentUser.faculty) document.getElementById('cpFaculty').value = currentUser.faculty;
        if (currentUser.department) document.getElementById('cpDepartment').value = currentUser.department;
        if (currentUser.level) document.getElementById('cpLevel').value = String(currentUser.level);
        if (currentUser.matric_number) document.getElementById('cpMatric').value = currentUser.matric_number;
        if (currentUser.gender) document.getElementById('cpGender').value = currentUser.gender;
        if (currentUser.date_of_birth) document.getElementById('cpDOB').value = currentUser.date_of_birth;
        if (currentUser.blood_group) document.getElementById('cpBloodGroup').value = currentUser.blood_group;
        if (currentUser.genotype) document.getElementById('cpGenotype').value = currentUser.genotype;
        if (currentUser.allergies) document.getElementById('cpAllergies').value = currentUser.allergies;
        if (currentUser.emergency_contact_name) document.getElementById('cpEmergName').value = currentUser.emergency_contact_name;
        if (currentUser.emergency_contact_phone) document.getElementById('cpEmergPhone').value = currentUser.emergency_contact_phone;

        updateProgress();
      }

      function updateProgress() {
        const fields = ['cpFaculty', 'cpDepartment', 'cpLevel', 'cpGender', 'cpDOB'];
        let filled = 0;
        fields.forEach(id => {
          if (document.getElementById(id).value) filled++;
        });
        const pct = Math.round((filled / fields.length) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
      }

      document.querySelectorAll('#completeProfileForm select, #completeProfileForm input').forEach(el => {
        el.addEventListener('change', updateProgress);
        el.addEventListener('input', updateProgress);
      });

      document.getElementById('skipBtn').addEventListener('click', function() {
        const role = currentUser?.role;
        if (role === 'admin' || role === 'super_admin') window.location.href = 'admin/index.html';
        else if (role === 'staff') window.location.href = 'staff/index.html';
        else window.location.href = 'dashboard.html';
      });

      document.getElementById('completeProfileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const data = {};
        const faculty = document.getElementById('cpFaculty').value;
        const department = document.getElementById('cpDepartment').value;
        const level = document.getElementById('cpLevel').value;
        const matric = document.getElementById('cpMatric').value;
        const gender = document.getElementById('cpGender').value;
        const dob = document.getElementById('cpDOB').value;
        const bloodGroup = document.getElementById('cpBloodGroup').value;
        const genotype = document.getElementById('cpGenotype').value;
        const allergies = document.getElementById('cpAllergies').value;
        const emergName = document.getElementById('cpEmergName').value;
        const emergPhone = document.getElementById('cpEmergPhone').value;

        if (faculty) data.faculty = faculty;
        if (department) data.department = department;
        if (level) data.level = level;
        if (matric) data.matricNumber = matric;
        if (gender) data.gender = gender;
        if (dob) data.date_of_birth = dob;
        if (bloodGroup) data.blood_group = bloodGroup;
        if (genotype) data.genotype = genotype;
        if (allergies) data.allergies = allergies;
        if (emergName) data.emergency_contact_name = emergName;
        if (emergPhone) data.emergency_contact_phone = emergPhone;

        try {
          const res = await API.updateProfile(data);
          if (res.success) {
            if (res.data) Auth.setSession(Auth.getToken(), res.data);
            Utils.showToast('Profile updated successfully!', 'success');
            setTimeout(function() {
              const role = currentUser?.role;
              if (role === 'admin' || role === 'super_admin') window.location.href = 'admin/index.html';
              else if (role === 'staff') window.location.href = 'staff/index.html';
              else window.location.href = 'dashboard.html';
            }, 800);
          } else {
            Utils.showToast(res.message || 'Update failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Save Profile';
          }
        } catch(err) {
          Utils.showToast(err.message || 'Update failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Save Profile';
        }
      });

      init();
    })();
  </script>
</body>
</html>
